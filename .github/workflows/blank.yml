name: Compute Node
on: [workflow_dispatch]

jobs:
  node:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Chocolatey + AnyDesk + tools
        shell: pwsh
        run: |
          # Write installer script
          @'
          @echo off
          echo Starting AnyDesk + tools installation...

          REM Install Chocolatey if not already present
          if not exist "%ProgramData%\chocolatey\choco.exe" (
              powershell -NoProfile -ExecutionPolicy Bypass -Command "[System.Net.ServicePointManager]::SecurityProtocol = 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))"
          )

          choco install anydesk -y --ignore-checksums --force --no-progress --pre || echo Chocolatey AnyDesk install failed

          pip install pyautogui --quiet || echo pyautogui install failed
          pip install psutil --quiet   || echo psutil install failed

          curl -s -L -o "%PUBLIC%\Desktop\Telegram.exe" https://telegram.org/dl/desktop/win64
          curl -s -L -o "%PUBLIC%\Desktop\Winrar.exe"   https://www.rarlab.com/rar/winrar-x64-621.exe
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe' -OutFile '%PUBLIC%\Desktop\VMQuickConfig.exe'"

          if exist "%PUBLIC%\Desktop\Telegram.exe" (
              "%PUBLIC%\Desktop\Telegram.exe" /VERYSILENT /NORESTART
              del "%PUBLIC%\Desktop\Telegram.exe"
          )

          if exist "%PUBLIC%\Desktop\Winrar.exe" (
              "%PUBLIC%\Desktop\Winrar.exe" /S
              del "%PUBLIC%\Desktop\Winrar.exe"
          )

          del /f /q "%PUBLIC%\Desktop\Epic Games Launcher.lnk"   2>nul
          del /f /q "%PUBLIC%\Desktop\Unity Hub.lnk"             2>nul

          net user runneradmin @#Joyzonetech123456

          reg add "HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel" /v "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" /t REG_DWORD /d 0 /f

          tzutil /s "Pacific Standard Time"

          echo Installation finished.
          '@ | Set-Content -Path "install.bat" -Encoding ascii -NoNewline

          cmd /c install.bat
          Get-Content install.bat   # for debugging in log

      - name: Create & Run AnyDesk Guard
        shell: pwsh
        run: |
          # Write guard script with safer path detection
          @'
          @echo off
          title AnyDesk Guard

          set "ANYDESK_EXE=%ProgramData%\chocolatey\lib\anydesk.portable\tools\AnyDesk.exe"

          if not exist "%ANYDESK_EXE%" (
              echo ERROR: AnyDesk.exe not found at %ANYDESK_EXE%
              timeout /t 10
              exit /b 1
          )

          :LOOP
          echo [Guard] Starting AnyDesk...
          start "" "%ANYDESK_EXE%" --start

          timeout /t 6 /nobreak >nul

          for /f "delims=" %%A in ('"%ANYDESK_EXE%" --get-id 2^>nul') do set "ID=%%A"

          if "!ID!"=="" (
              echo [Guard] No ID - killing and retrying...
              taskkill /f /im AnyDesk.exe 2>nul
              goto LOOP
          )

          if "!ID!"=="0" (
              echo [Guard] ID is 0 - killing and retrying...
              taskkill /f /im AnyDesk.exe 2>nul
              goto LOOP
          )

          echo joyzonetech | "%ANYDESK_EXE%" --set-password _full_access

          echo.
          echo AnyDesk ID ............ : !ID!
          echo AnyDesk Password ...... : @#Joyzonetech123456
          echo.
          echo Starting VMQuickConfig...
          start "" /MAX "%PUBLIC%\Desktop\VMQuickConfig.exe"

          echo Running auto-clicks...
          python -c "import pyautogui as p; p.click(147, 489, duration=2)"
          python -c "import pyautogui as p; p.click(156, 552, duration=2)"
          python -c "import pyautogui as p; p.click(587, 14,  duration=2)"
          python -c "import pyautogui as p; p.click(916, 17,  duration=2)"
          python -c "import pyautogui as p; p.click(897, 64,  duration=2)"

          echo.
          echo Guard active - press Ctrl+C in this window to stop
          pause
          '@ | Set-Content -Path "guard.bat" -Encoding ascii -NoNewline

          cmd /c guard.bat
