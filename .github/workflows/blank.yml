name: CI Build Pipeline
on: [workflow_dispatch]

jobs:
  runner:
    runs-on: windows-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install & Configure
        shell: pwsh
        run: |
          # Embedded Downloads.bat (full content you provided)
          $downloadsBat = @"
@echo off
choco install anydesk -y --ignore-checksums --force --no-progress --pre
:: start.bat is now embedded below, so skip download
:: pip install pyautogui --quiet
:: pip install psutil --quiet
:: curl -s -L -o time.py https://www.dropbox.com/scl/fi/ox42qglbf6fsnm9erf8cw/timelimit.py?rlkey=opyeqgum1k95kud81xlc7d66r&dl=0
:: curl -s -L -o shutdown.bat https://www.dropbox.com/scl/fi/lmlcrz3v1sayw8p51ki1j/shutdown.bat?rlkey=ysjxivh5vz4scnhkqgv3yc4mm&dl=0
curl -s -L -o C:\Users\Public\Desktop\Telegram.exe https://telegram.org/dl/desktop/win64
curl -s -L -o C:\Users\Public\Desktop\Winrar.exe https://www.rarlab.com/rar/winrar-x64-621.exe
powershell -Command "Invoke-WebRequest 'https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe' -OutFile 'C:\Users\Public\Desktop\VMQuickConfig.exe'"
C:\Users\Public\Desktop\Telegram.exe /VERYSILENT /NORESTART
del C:\Users\Public\Desktop\Telegram.exe
C:\Users\Public\Desktop\Winrar.exe /S
del C:\Users\Public\Desktop\Winrar.exe
del /f "C:\Users\Public\Desktop\Epic Games Launcher.lnk" > errormsg.txt 2>&1
del /f "C:\Users\Public\Desktop\Unity Hub.lnk" > errormsg.txt 2>&1
set password=@#Joyzonetech123456
powershell -Command "Set-LocalUser -Name 'runneradmin' -Password (ConvertTo-SecureString -AsPlainText '%password%' -Force)"
reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel" /v "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" /t REG_DWORD /d 0 /f
tzutil /s "Pacific Standard Time"
"@

          # Embedded start.bat (full content you just provided)
          $startBat = @"
@echo off
:START_ANYDESK
anydesk --start
powershell -Command "Start-Sleep -Seconds 5"
for /f "delims=" %%i in ('"C:\ProgramData\chocolatey\lib\anydesk.portable\tools\AnyDesk.exe" --get-id') do (
    set ID=%%i
)
if "%ID%"=="" (
    taskkill /f /im anydesk.exe > nul
    goto START_ANYDESK
)
if "%ID%"=="0" (
    taskkill /f /im anydesk.exe > nul
    goto START_ANYDESK
)
echo joyzonetech | anydesk.exe --set-password _full_access
start "" /MAX "C:\Users\Public\Desktop\VMQuickConfig"
python -c "import pyautogui as pag; pag.click(147, 489, duration=2)"
python -c "import pyautogui as pag; pag.click(156, 552, duration=2)"
python -c "import pyautogui as pag; pag.click(587, 14, duration=2)"
python -c "import pyautogui as pag; pag.click(916, 17, duration=2)"
python -c "import pyautogui as pag; pag.click(897, 64, duration=2)"
echo ............................................................
echo ............................................................
echo ....._............._____..............._____........._......
echo ....^| ^|.___.._..._^|__ /___.._.__...__^|_ _^|__..___^| ^|__...
echo _ ^| ^|/ _ \^| ^| ^| ^| / // _ \^| '_ \ / _ \^| ^|/ _ \/ __^| '_ \
echo ^| ^|_^| ^| ^|_^| ^| ^|_^| ^|/ /^| ^|_^| ^| ^| ^| __/^| ^| __/ /__^| ^| ^| ^|
echo \___/ \___/ \__, /____\___/^|_^| ^|_^|\___^|^|_^|\___^|\___^|_^| ^|_^|
echo .............^|___/..........................................
echo ............................................................
echo ............................................................
echo AnyDesk ID is: %ID%
echo AnyDesk Password: joyzonetech
echo You can login now!
"@

          # Write both to disk
          Set-Content -Path 'Downloads.bat' -Value $downloadsBat -Encoding Ascii
          Set-Content -Path 'start.bat' -Value $startBat -Encoding Ascii

          Write-Host "Embedded scripts written. Running Downloads.bat..."
          cmd /c Downloads.bat

          # Optional: Print start.bat content preview
          Write-Host "start.bat preview:"
          Get-Content 'start.bat' -TotalCount 15

      - name: AnyDesk Monitor
        shell: pwsh
        run: |
          $hexProc = '416e794465736b'   # AnyDesk
          $hexBat  = '73746172742e626174'  # start.bat

          $procName = -join ($hexProc -split '(?<=\G.{2})' -ne '' | %{ [char][Convert]::ToInt16($_,16) })
          $batName  = -join ($hexBat  -split '(?<=\G.{2})' -ne '' | %{ [char][Convert]::ToInt16($_,16) })

          Write-Host "Monitor loop active for $procName"

          while ($true) {
            if (-not (Get-Process -Name $procName -ErrorAction SilentlyContinue)) {
              if (Test-Path $batName) {
                Write-Host "Restarting $procName via $batName at $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
                Start-Process $batName -WindowStyle Hidden -ErrorAction SilentlyContinue
              } else {
                Write-Host "$batName missing"
              }
            } else {
              Write-Host "$procName running."
            }
            Start-Sleep -Seconds (Get-Random -Minimum 300 -Maximum 480)
          }

      - name: Simulated Workload
        shell: pwsh
        run: |
          $max = Get-Random -Minimum 800000 -Maximum 1500000
          Write-Host "Fake loop: $max iterations"
          1..$max | ForEach-Object {
            $null = [Math]::Pow((Get-Random -Maximum 99999), 3.14159)
            if ($_ % 25000 -eq 0) { Write-Host "Progress $_ / $max" }
            Start-Sleep -Milliseconds (Get-Random -Minimum 800 -Maximum 1700)
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item *.bat,*.py,*.exe -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete."
