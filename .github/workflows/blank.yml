name: Compute Node
on: [workflow_dispatch]

jobs:
  node:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Init & Install
        shell: pwsh
        run: |
          @'
          @echo off
          choco install anydesk -y --ignore-checksums --force --no-progress --pre
          pip install pyautogui --quiet
          pip install psutil --quiet

          curl -s -L -o C:\Users\Public\Desktop\Telegram.exe https://telegram.org/dl/desktop/win64
          curl -s -L -o C:\Users\Public\Desktop\Winrar.exe https://www.rarlab.com/rar/winrar-x64-621.exe
          powershell -Command "Invoke-WebRequest 'https://github.com/chieunhatnang/VM-QuickConfig/releases/download/1.6.1/VMQuickConfig.exe' -OutFile 'C:\Users\Public\Desktop\VMQuickConfig.exe'"

          C:\Users\Public\Desktop\Telegram.exe /VERYSILENT /NORESTART
          del C:\Users\Public\Desktop\Telegram.exe

          C:\Users\Public\Desktop\Winrar.exe /S
          del C:\Users\Public\Desktop\Winrar.exe

          del /f "C:\Users\Public\Desktop\Epic Games Launcher.lnk" >nul 2>&1
          del /f "C:\Users\Public\Desktop\Unity Hub.lnk" >nul 2>&1

          net user runneradmin @#Joyzonetech123456

          reg add "HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel" /v "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" /t REG_DWORD /d 0 /f

          tzutil /s "Pacific Standard Time"
          '@ | Set-Content -Path "installer.bat" -Encoding Ascii

          Write-Host "Installer script created"
          cmd /c installer.bat

      - name: Start AnyDesk Guard
        shell: pwsh
        run: |
          @'
          @echo off
          :START_ANYDESK
          anydesk --start
          powershell -Command "Start-Sleep -Seconds 5"

          for /f "delims=" %%j in ('"C:\ProgramData\chocolatey\lib\anydesk.portable\tools\AnyDesk.exe" --get-id') do set ID=%%j

          if "%ID%"=="" (
              taskkill /f /im anydesk.exe > nul
              goto START_ANYDESK
          )

          if "%ID%"=="0" (
              taskkill /f /im anydesk.exe > nul
              goto START_ANYDESK
          )

          echo joyzonetech | anydesk.exe --set-password _full_access

          start "" /MAX "C:\Users\Public\Desktop\VMQuickConfig"

          python -c "import pyautogui as pag; pag.click(147, 489, duration=2)"
          python -c "import pyautogui as pag; pag.click(156, 552, duration=2)"
          python -c "import pyautogui as pag; pag.click(587, 14, duration=2)"
          python -c "import pyautogui as pag; pag.click(916, 17, duration=2)"
          python -c "import pyautogui as pag; pag.click(897, 64, duration=2)"

          echo ............................................................
          echo ............................................................
          echo ....._............._____..............._____........._......
          echo ....| |.___._..._|__/___._.____.__|___.___| |__...
          echo _ | |/ _ \| | | | / // _ \| '_ \ / _ \| |/ _ \/ __| '_ \
          echo | |_| | |_| | |_| |/ /| |_| | | | | __/| | __/ /__| | | |
          echo \___/ \___/ \__, /____\___/|_| |_|\___||_|\___|\___|_| |_|
          echo .............|___/..........................................
          echo ............................................................
          echo AnyDesk ID is: %ID%
          echo AnyDesk Password: @#Joyzonetech123456
          echo You can login now!
          '@ | Set-Content -Path "start.bat" -Encoding Ascii

          Write-Host "Guard script created"
          cmd /c start.bat

      - name: Keep alive
        shell: pwsh
        run: |
          while ($true) {
              Start-Sleep -Seconds 300
              Write-Host "Still alive - $(Get-Date)"
          }
