          REM ──────────────────────────────────────────────
          REM Final display + infinite keep-alive
          REM ──────────────────────────────────────────────

          if "!ID!"=="" (
              echo WARNING - No ID captured.
              echo Last raw output: [!RAW_ID!]
              echo Try connecting manually first.
          ) else (
              echo.
              echo =============================================
              echo AnyDesk ID:           !ID!
              echo Password:             %ANYDESK_PASSWORD%
              echo =============================================
              echo Connect from your local AnyDesk client now.
          )

          echo.
          echo Session ready - keeping alive...
          echo.

          :KEEP_ALIVE
          echo [Alive] AnyDesk ready - ID: !ID! - %DATE% %TIME%
          powershell -Command "Start-Sleep -Seconds 300"
          goto KEEP_ALIVE
